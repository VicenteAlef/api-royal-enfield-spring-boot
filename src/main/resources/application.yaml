spring:
  application:
    name: api-re

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:royal_enfield_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:no-reply@royalenfield.com.br}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
  admin:
    default-name: ${ADMIN_NAME:Administrador Vicente}
    default-email: ${ADMIN_EMAIL:admin@royalenfield.com.br}
    default-password: ${ADMIN_PASSWORD:Admin@123}
    notification-email: ${ADMIN_NOTIFICATION_EMAIL:admin@royalenfield.com.br}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://royalenfield.vicentedeveloper.com,http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

