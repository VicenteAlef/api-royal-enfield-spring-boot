spring:
  application:
    name: api-re

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:royal_enfield_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

security:
  admin:
    username: ${SECURITY_ADMIN_USERNAME:admin}
    password: ${SECURITY_ADMIN_PASSWORD:admin123}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://royalenfield.vicentedeveloper.com,http://localhost:3000,http://localhost:5173}
