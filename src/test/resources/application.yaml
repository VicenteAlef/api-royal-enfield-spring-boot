spring:
  application:
    name: api-re-test

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:royal_enfield_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:test@royalenfield.com.br}
    password: ${SPRING_MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./target/test-uploads}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:10}
  admin:
    default-name: ${ADMIN_NAME:Administrador Vicente}
    default-email: ${ADMIN_EMAIL:admin@royalenfield.com.br}
    default-password: ${ADMIN_PASSWORD:Admin@123}
    notification-email: ${ADMIN_NOTIFICATION_EMAIL:admin@royalenfield.com.br}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
