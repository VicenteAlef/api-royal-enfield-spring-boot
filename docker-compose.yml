services:
  postgres:
    image: postgres:16-alpine
    container_name: api-re-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-royal_enfield_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api-network

  api-re:
    image: ghcr.io/vicentealef/api-royal-enfield-spring-boot:latest
    container_name: api-re-app
    restart: always
    ports:
      - "${API_PORT:-3001}:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-royal_enfield_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - SECURITY_ADMIN_USERNAME=${SECURITY_ADMIN_USERNAME}
      - SECURITY_ADMIN_PASSWORD=${SECURITY_ADMIN_PASSWORD}
      - FILE_UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - api-network

networks:
  api-network:
    driver: bridge

volumes:
  postgres_data:
