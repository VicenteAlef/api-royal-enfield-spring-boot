services:
  postgres:
    image: postgres:16-alpine
    container_name: api-re-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api-network

  api-re:
    build: .
    image: ghcr.io/vicentealef/api-royal-enfield-spring-boot:latest
    container_name: api-re-app
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - api-network

networks:
  api-network:
    driver: bridge

volumes:
  postgres_data:
